name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: '5.8', testbench: '3.8', php: '7.3', phpunit: '8.5' }
          - { laravel: '6', testbench: '4', php: '7.3', phpunit: '8.5' }
          - { laravel: '7', testbench: '5', php: '7.4', phpunit: '9.6' }
          - { laravel: '8', testbench: '6', php: '7.4', phpunit: '9.6' }
          - { laravel: '9', testbench: '7', php: '8.0', phpunit: '9.6' }
          - { laravel: '10', testbench: '8', php: '8.1', phpunit: '10.5' }
          - { laravel: '11', testbench: '9', php: '8.2', phpunit: '11.5' }
          - { laravel: '12', testbench: '10', php: '8.2', phpunit: '11.5' }
          - { laravel: '12', testbench: '10', php: '8.4', phpunit: '11.5' }
          - { laravel: '13', testbench: '11', php: '8.3', phpunit: '12.0' }
          - { laravel: '13', testbench: '11', php: '8.4', phpunit: '12.0' }
          - { laravel: '13', testbench: '11', php: '8.5', phpunit: '12.0' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Resolve compatibility dependencies
        env:
          COMPOSER_NO_SECURITY_BLOCKING: '1'
        run: |
          composer require --dev --no-update "laravel/framework:^${{ matrix.laravel }}" "orchestra/testbench:^${{ matrix.testbench }}" "phpunit/phpunit:^${{ matrix.phpunit }}"
          composer update --prefer-dist --no-interaction
      - run: composer lint
      - run: composer test
      - run: BLOCKER_PLAIN_CONTROLLER=1 composer test

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer validate --strict --no-check-lock
      - run: composer install --prefer-dist --no-interaction
      - run: composer audit --locked
      - run: composer install --working-dir=tools --prefer-dist --no-interaction
      - run: tools/vendor/bin/pint --test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: composer install --prefer-dist --no-interaction
      - run: npm ci && npm run build && npx playwright install --with-deps chromium && npm test
        working-directory: tests/browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-results
          path: tests/browser/test-results
